[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexpilot-public"
version = "0.2.0"
description = "Local-first phone terminal cockpit for private NexPilot beta testers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Private beta evaluation only" }
authors = [{ name = "Rain" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]
windows = [
  "pywinpty>=2.0.13; platform_system == 'Windows'",
]

[project.scripts]
nexpilot = "nexpilot_public.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexpilot_public = ["static/*"]
